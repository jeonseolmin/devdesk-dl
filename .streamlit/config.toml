[server]
maxUploadSize = 25  # MB; every upload widget, enforced by the server (the default is 200)

[browser]
gatherUsageStats = false

[theme]  # light: the report charts are images on this surface; the page's header band carries DevDesk's dark colours
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f2f4"
textColor = "#1c2330"
borderColor = "#e4e3df"
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css, sans-serif"
baseRadius = "medium"
